\r
## 인터랙티브 시각화 (Plotly / Streamlit)\r
\r
탐색적 분석, 이해관계자 공유, 의사결정 지원을 위한 산출물. 상호작용과 공유 가능성이 핵심이다.\r
\r
### Plotly 기본 패턴\r
\r
```python\r
import plotly.express as px\r
import plotly.graph_objects as go\r
\r
# 라인 차트 — 그룹별 추세\r
fig = px.line(\r
    df, x="date", y="value", color="group",\r
    title="그룹별 월간 추이",\r
    labels={"value": "값", "date": "날짜"},\r
    color_discrete_sequence=px.colors.qualitative.Safe  # 색약 친화\r
)\r
fig.update_layout(hovermode="x unified")\r
fig.show()\r
```\r
\r
### Streamlit 대시보드 패턴\r
\r
```python\r
import streamlit as st\r
import plotly.express as px\r
\r
st.title("분석 대시보드")\r
\r
# 사이드바 필터\r
selected_group = st.sidebar.multiselect("그룹 선택", options=df["group"].unique(), default=df["group"].unique())\r
date_range = st.sidebar.date_input("기간", [df["date"].min(), df["date"].max()])\r
\r
filtered = df[\r
    df["group"].isin(selected_group) &\r
    df["date"].between(str(date_range[0]), str(date_range[1]))\r
]\r
\r
fig = px.line(filtered, x="date", y="value", color="group", title="필터링된 추세")\r
st.plotly_chart(fig, use_container_width=True)\r
```\r
\r
### HTML 저장 (공유용)\r
\r
```python\r
fig.write_html("results/dashboard.html", include_plotlyjs="cdn")\r
```\r
\r
### 인터랙션 설계 기준\r
\r
- **Hover**: 정확한 수치 + 단위 표시. 시각적 위치만으로 값을 읽도록 강요하지 않음.\r
- **필터/슬라이더**: 선택 상태가 화면 어딘가에 명확히 표시될 것.\r
- **Zoom/Pan**: 시계열·산점도에서 조밀한 데이터 탐색 시 활성화.\r
- **Linked views**: 동일 데이터를 두 차트로 볼 때 선택이 양쪽에 반영되도록.\r
\r
---\r
\r
## 차트 유형 선택 가이드\r
\r
| 분석 목적 | 권장 차트 | 주의사항 |\r
|----------|-----------|---------|\r
| 분포 확인 | 히스토그램, KDE, 박스플롯 | 구간(bin) 크기가 해석에 영향 |\r
| 그룹 비교 | 막대 그래프, 바이올린 플롯 | 막대는 0 기준 유지 |\r
| 추세 | 라인 차트 | 종횡비(aspect ratio)가 변화율 인상에 영향 |\r
| 관계·상관 | 산점도 | 3D 차트 사용 지양 |\r
| 구성 비율 | 스택 바 (≥5개), 파이 차트 (≤4개) | 파이 차트는 비교 어려움 |\r
| 패턴·행렬 | 히트맵 | 색상 스케일 기준점(center) 명시 |\r
\r
## 공통 품질 기준\r
\r
- **색상**: `colorblind` 팔레트 또는 `viridis`/`Safe` 계열 우선. 빨강-초록 단독 구분 금지.\r
- **축 범위**: 막대 그래프는 0 기준. 라인 차트는 변화 맥락을 보여주는 범위 사용하되, 절단 시 명시.\r
- **이중 축(dual axis)**: 혼동 유발 가능성 높음. 가급적 subplots으로 분리.\r
- **제목**: 인사이트 중심 서술 또는 핵심 질문 형태.\r
- **재현성**: 동일 코드·데이터로 동일 이미지 재현 가능. 랜덤 요소가 있으면 시드 고정.\r
