## 정적 시각화 (matplotlib / seaborn)\r
\r
논문, 보고서, 발표 자료에 삽입되는 산출물. 저장 형식과 레이아웃의 재현성이 핵심이다.\r
\r
### 기본 설정\r
\r
```python\r
import matplotlib.pyplot as plt\r
import seaborn as sns\r
\r
# 한국어 폰트 (Mac)\r
plt.rcParams['font.family'] = 'AppleGothic'\r
plt.rcParams['axes.unicode_minus'] = False\r
plt.rcParams['figure.dpi'] = 120          # 작업 중 미리보기\r
plt.rcParams['figure.figsize'] = (8, 5)\r
\r
# 색약 친화 팔레트\r
PALETTE = sns.color_palette("colorblind")\r
sns.set_style("whitegrid")\r
```\r
\r
### 저장 기준\r
\r
```python\r
OUTPUT_DIR = Path("results/figures")\r
OUTPUT_DIR.mkdir(parents=True, exist_ok=True)\r
\r
# 논문/보고서 제출용: PDF (벡터) + PNG (래스터) 병행 저장\r
fig.savefig(OUTPUT_DIR / "figure_01.pdf", bbox_inches="tight")\r
fig.savefig(OUTPUT_DIR / "figure_01.png", dpi=300, bbox_inches="tight", facecolor="white")\r
```\r
\r
- **해상도**: 최종 저장은 반드시 `dpi=300` 이상.\r
- **형식**: 선 그래프·벡터 도형은 PDF, 사진·복잡한 래스터 이미지는 PNG.\r
- **배경**: `facecolor="white"` 명시 (투명 배경은 인쇄 시 문제 발생).\r
- **흑백 가독성**: 컬러 팔레트 의존 없이 선 스타일(실선/점선/파선)·마커로도 구분 가능하게 설계.\r
- **일관성**: 동일 분석 내에서 색상 체계, 폰트 크기, 축 범위, 범례 위치를 통일.\r
\r
### 필수 요소\r
\r
```python\r
ax.set_title("그룹별 월간 매출 추이 (2023)", fontsize=13, pad=12)\r
ax.set_xlabel("월", fontsize=11)\r
ax.set_ylabel("매출 (백만 원)", fontsize=11)\r
ax.legend(title="지역", framealpha=0.8)\r
\r
# 외부 데이터 출처 표기\r
fig.text(0.99, 0.01, "출처: 내부 매출 DB, 2024-01", ha="right", fontsize=8, color="gray")\r
```\r
\r
- 제목: 변수명 나열이 아닌 인사이트 또는 질문 형태 (`"Q3 매출 증가율이 둔화됨"` > `"분기별 매출"`)\r
- 축 레이블에 단위 포함\r
- 범례가 데이터를 가리지 않도록 위치 조정 또는 직접 레이블링\r
\r
