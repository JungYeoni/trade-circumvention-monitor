## 피처 검증 기준\r
\r
모든 피처는 아래 4가지 기준을 통과해야 모델에 포함된다.\r
\r
| 기준 | 질문 | 측정 방법 |\r
|------|------|----------|\r
| **타당성 (Validity)** | 이 피처가 실제로 의도한 개념을 측정하는가? | 도메인 리뷰 + 타겟과의 상관관계 |\r
| **안정성 (Stability)** | 시간/데이터 서브셋 변화에도 분포가 일정한가? | PSI (Population Stability Index); PSI > 0.2이면 드리프트 심각 |\r
| **비중복성 (Non-redundancy)** | 기존 피처 대비 추가 정보를 제공하는가? | 피처 간 상관 > 0.95이면 중복 의심; VIF, Mutual Information |\r
| **해석 가능성 (Interpretability)** | 도메인 전문가에게 설명 가능한가? | 수동 리뷰; SHAP 값 방향성 확인 |\r
\r
```python\r
def compute_psi(expected: pd.Series, actual: pd.Series, bins: int = 10) -> float:\r
    ""\"PSI(Population Stability Index) 계산 — 분포 드리프트 탐지""\"\r
    breakpoints = np.linspace(expected.min(), expected.max(), bins + 1)\r
    exp_pct = np.histogram(expected, bins=breakpoints)[0] / len(expected)\r
    act_pct = np.histogram(actual, bins=breakpoints)[0] / len(actual)\r
\r
    # 0 나눗셈 방지\r
    exp_pct = np.where(exp_pct == 0, 1e-4, exp_pct)\r
    act_pct = np.where(act_pct == 0, 1e-4, act_pct)\r
\r
    psi = np.sum((act_pct - exp_pct) * np.log(act_pct / exp_pct))\r
    return psi\r
```\r
