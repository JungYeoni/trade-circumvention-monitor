\r
### 3. GIS 피처\r
\r
**목표**: 좌표·경계 데이터를 행정구역 단위로 집계하거나, 공간 관계에서 파생변수를 생성.\r
\r
**행정구역 집계:**\r
- 포인트 데이터를 `gpd.sjoin`으로 행정구역(시·군·구, 읍·면·동)에 매핑\r
- 지역별 count, mean, density(단위 면적·인구당) 계산\r
- 지역 크기 차이 보정: 면적 또는 인구로 정규화\r
\r
**공간 조인 워크플로우:**\r
- 조인 전 CRS 일치 여부 확인 (`gdf.crs`)\r
- 한국 데이터 기본 CRS: WGS84(`EPSG:4326`) 또는 한국 표준(`EPSG:5186`)\r
- 매칭되지 않은 포인트 반드시 점검 후 처리 방침 결정\r
\r
**지역 단위 파생변수:**\r
- 최근접 시설까지의 거리 (병원, 지하철역, 상권 등): 투영 좌표계에서 미터 단위 계산\r
- 공간 래그 (Spatial lag): 인접 지역의 평균값 — 공간 자기상관 구조 포착\r
- 클러스터 소속 (공간 DBSCAN 결과를 범주형 피처로)\r
\r
```python\r
import geopandas as gpd\r
import pandas as pd\r
from shapely.geometry import Point\r
\r
def points_to_admin(\r
    df: pd.DataFrame,\r
    admin_gdf: gpd.GeoDataFrame,\r
    lat_col: str,\r
    lon_col: str,\r
    admin_key: str = 'adm_cd'\r
) -> gpd.GeoDataFrame:\r
    ""\"포인트 → 행정구역 공간조인 및 검증""\"\r
    geometry = [Point(lon, lat) for lon, lat in zip(df[lon_col], df[lat_col])]\r
    points_gdf = gpd.GeoDataFrame(df.copy(), geometry=geometry, crs='EPSG:4326')\r
    admin_gdf = admin_gdf.to_crs('EPSG:4326')\r
\r
    joined = gpd.sjoin(\r
        points_gdf,\r
        admin_gdf[[admin_key, 'adm_nm', 'geometry']],\r
        how='left',\r
        predicate='within'\r
    )\r
\r
    unmatched = joined[admin_key].isna().sum()\r
    if unmatched > 0:\r
        print(f"⚠ 행정구역 매칭 실패: {unmatched}건 ({unmatched/len(df)*100:.1f}%) — 처리 방침 결정 필요")\r
\r
    return joined\r
\r
\r
def compute_admin_stats(\r
    joined_gdf: gpd.GeoDataFrame,\r
    value_col: str,\r
    admin_key: str = 'adm_cd'\r
) -> pd.DataFrame:\r
    ""\"행정구역 단위 집계 통계 생성""\"\r
    stats = (\r
        joined_gdf\r
        .groupby(admin_key)[value_col]\r
        .agg(['count', 'mean', 'median', 'std'])\r
        .rename(columns={\r
            'count': f'{value_col}_count',\r
            'mean': f'{value_col}_mean',\r
            'median': f'{value_col}_median',\r
            'std': f'{value_col}_std'\r
        })\r
        .reset_index()\r
    )\r
    return stats\r
```\r
