\r
### 2. 정형 테이블 피처\r
\r
**목표**: 범주형·수치형 변수를 모델에 적합한 형태로 변환하되, 변환 파라미터는 학습 데이터에서만 학습.\r
\r
**인코딩 전략:**\r
\r
| 변수 유형 | 방법 | 주의사항 |\r
|-----------|------|---------|\r
| 저카디널리티 범주형 (≤10) | OneHotEncoding | 학습 외 범주는 ignore |\r
| 고카디널리티 범주형 | Target Encoding (CV fold 내) 또는 Frequency Encoding | 테스트셋 정보 유입 금지 |\r
| 순서형 범주형 | OrdinalEncoding (순서 명시) | 순서가 없으면 OneHot 사용 |\r
| 주기형 (시간, 요일) | sin/cos 인코딩 | — |\r
\r
**스케일링:**\r
- `StandardScaler`, `MinMaxScaler`는 학습 데이터에서만 `fit`\r
- 트리 기반 모델(XGBoost, RandomForest)에는 스케일링 불필요\r
- 선형 모델·거리 기반 모델에만 적용\r
\r
**Interaction terms & 파생 변수:**\r
- 도메인 의미가 있는 비율·차이 변수 우선 (예: `revenue_per_user = revenue / dau`)\r
- 교호작용 항은 개별 변수만으로 설명되지 않는 비선형 패턴이 있을 때만 추가\r
- 다항식 피처는 차수 2 이하로 제한, 실질적 근거 필요\r
\r
```python\r
from sklearn.pipeline import Pipeline\r
from sklearn.compose import ColumnTransformer\r
from sklearn.preprocessing import StandardScaler, OneHotEncoder\r
from sklearn.impute import SimpleImputer\r
\r
def build_preprocessor(num_cols: list, cat_cols: list) -> ColumnTransformer:\r
    ""\"전처리 파이프라인 — 학습/검증 분리 후 파이프라인 내에서만 fit""\"\r
    num_pipe = Pipeline([\r
        ('imputer', SimpleImputer(strategy='median')),\r
        ('scaler', StandardScaler())\r
    ])\r
    cat_pipe = Pipeline([\r
        ('imputer', SimpleImputer(strategy='most_frequent')),\r
        ('encoder', OneHotEncoder(handle_unknown='ignore', sparse_output=False))\r
    ])\r
    return ColumnTransformer([\r
        ('num', num_pipe, num_cols),\r
        ('cat', cat_pipe, cat_cols)\r
    ])\r
```\r
\r
