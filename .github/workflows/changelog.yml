name: Changelog 자동 업데이트

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-changelog:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 전체 git 히스토리 필요

      - name: git-cliff 설치
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: git-cliff로 CHANGELOG 생성
        run: git-cliff --config cliff.toml --verbose --output CHANGELOG.md

      - name: README에 최근 변경사항 주입
        run: |
          # CHANGELOG.md에서 첫 번째 섹션(최근 변경사항)만 추출
          RECENT=$(awk '/^## /{count++} count==1{print} count==2{exit}' CHANGELOG.md)

          # README의 마커 사이에 내용 삽입
          python3 - <<'EOF'
          import re

          with open("CHANGELOG.md") as f:
              changelog = f.read()

          # 첫 번째 ## 섹션만 추출
          match = re.search(r'(^## .+?)(?=^## |\Z)', changelog, re.MULTILINE | re.DOTALL)
          recent = match.group(1).strip() if match else ""

          with open("README.md") as f:
              readme = f.read()

          updated = re.sub(
              r'<!-- CHANGELOG_START -->.*?<!-- CHANGELOG_END -->',
              f'<!-- CHANGELOG_START -->\n{recent}\n<!-- CHANGELOG_END -->',
              readme,
              flags=re.DOTALL
          )

          with open("README.md", "w") as f:
              f.write(updated)
          EOF

      - name: CHANGELOG & README 커밋 & 푸시
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: CHANGELOG 자동 업데이트 [skip ci]"
          file_pattern: CHANGELOG.md README.md
